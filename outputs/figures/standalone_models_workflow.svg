   </g>
   <g id="text_2">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="109.8" y="294.157402" transform="rotate(-0 109.8 294.157402)">Data file</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="195.12" y="294.157402" transform="rotate(-0 195.12 294.157402)">Start / end</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="13.82201" transform="rotate(-0 222.48 13.82201)">Prepared data (2005–2022)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="24.656578" transform="rotate(-0 222.48 24.656578)">Monthly GHI, cloud amount and RH · elevation · 93 grid cells</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="60.057521" transform="rotate(-0 222.48 60.057521)">Define the forecast task (the same for every model)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(94.825883 70.892088)">From each December origin, forecast the 12 monthly GHI values of the next year,</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(164.066969 79.177802)">using only data available at the origin</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="58.32" y="130.960229" transform="rotate(-0 58.32 130.960229)">SARIMAX</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(21.62132 141.045328)">One model per grid cell</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(31.387148 150.075987)">Past GHI + cloud</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(29.511195 158.40663)">amount and RH of</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(30.894586 166.702883)">12 months earlier</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="170.64" y="130.960229" transform="rotate(-0 170.64 130.960229)">LSTM</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(142.815766 141.045328)">One global model</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(134.135461 149.380963)">12-month input window</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(141.731906 157.668341)">2 layers × 64 units</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(141.431266 166.038922)">12 outputs at once</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="282.96" y="130.96201" transform="rotate(-0 282.96 130.96201)">XGBoost</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(255.135766 141.045328)">One global model</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(246.064961 149.616706)">Past 12 months of GHI,</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(248.625398 158.363365)">cloud amount and RH</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(250.497469 166.692344)">+ horizon and month</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="395.28" y="130.963791" transform="rotate(-0 395.28 130.963791)">Reference forecasts</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(375.748898 141.043109)">Climatology:</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(369.036625 149.328823)">monthly average</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(370.018977 158.404966)">Seasonal naive:</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(361.345883 165.986782)">same month last year</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="216.850948" transform="rotate(-0 222.48 216.850948)">Forecasts</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="226.976578" transform="rotate(-0 222.48 226.976578)">12 monthly GHI values per model, grid cell and forecast year</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="264.000187" transform="rotate(-0 222.48 264.000187)">To model training and rolling validation</text>
