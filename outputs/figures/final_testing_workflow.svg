   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="14.540448" transform="rotate(-0 222.48 14.540448)">All data 2005–2024</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="24.656578" transform="rotate(-0 222.48 24.656578)">the test years 2023–2024 are used for the first time</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="57.02201" transform="rotate(-0 222.48 57.02201)">Keep every setting from model development</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="67.813313" transform="rotate(-0 222.48 67.813313)">same model orders, architectures, loss and weighting · no re-tuning</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="118.08" y="114.057739" transform="rotate(-0 118.08 114.057739)">Round 1</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(86.436188 124.84326)">Train on 2005–2022</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(75.462805 132.501068)">Forecast 2023 (12 months)</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="326.88" y="114.057739" transform="rotate(-0 326.88 114.057739)">Round 2</text>
   </g>
   <g id="text_11">
