    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(284.262805 132.501068)">Forecast 2024 (12 months)</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="177.29726" transform="rotate(-0 222.48 177.29726)">Pool all test forecasts</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="187.376578" transform="rotate(-0 222.48 187.376578)">93 grid cells × 24 months = 2,232 forecasts per model</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="219.071885" transform="rotate(-0 222.48 219.071885)">Compute pooled metrics</text>
   </g>
