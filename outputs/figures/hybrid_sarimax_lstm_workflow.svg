   </g>
   <g id="text_2">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="109.8" y="351.037402" transform="rotate(-0 109.8 351.037402)">Data file</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="195.12" y="351.037402" transform="rotate(-0 195.12 351.037402)">Start / end</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="13.825573" transform="rotate(-0 222.48 13.825573)">Prepared data</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="24.656578" transform="rotate(-0 222.48 24.656578)">Monthly GHI, cloud amount and RH · 93 grid cells</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="114.48" y="70.907396" transform="rotate(-0 114.48 70.907396)">SARIMAX component</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(74.629586 82.395987)">Forecasts GHI on its own</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(76.204344 90.021068)">(one model per grid cell)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="330.48" y="70.907396" transform="rotate(-0 330.48 70.907396)">LSTM component</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(290.629586 82.395987)">Forecasts GHI on its own</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(301.078789 90.021068)">(one global model)</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="133.501083" transform="rotate(-0 222.48 133.501083)">Measure each component's past errors</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(124.821719 144.332088)">Squared errors of its forecasts in all earlier years, per grid cell;</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(136.555023 152.661068)">recent years count more (each year further back × 0.8)</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="183.177521" transform="rotate(-0 222.48 183.177521)">Set time-varying weights (per grid cell and year)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(74.772266 194.012088)">w(SARIMAX) = error(LSTM) ÷ [error(SARIMAX) + error(LSTM)],  w(LSTM) = 1 − w(SARIMAX)</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(106.654594 202.297802)">so the component that has been more accurate recently gets more weight</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="234.175479" transform="rotate(-0 222.48 234.175479)">Combine the two forecasts</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="244.256578" transform="rotate(-0 222.48 244.256578)">Hybrid forecast = w(SARIMAX) × SARIMAX + w(LSTM) × LSTM</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="273.74201" transform="rotate(-0 222.48 273.74201)">Hybrid SARIMAX-LSTM forecast</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="284.576578" transform="rotate(-0 222.48 284.576578)">12 monthly GHI values per grid cell</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="320.9265" transform="rotate(-0 222.48 320.9265)">Next: add the clear-sky index (stack 2)</text>
   </g>
