    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="32.4" y="430.957402" transform="rotate(-0 32.4 430.957402)">External data source</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="161.28" y="430.957402" transform="rotate(-0 161.28 430.957402)">Process</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="238.68" y="430.957402" transform="rotate(-0 238.68 430.957402)">Decision</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="320.04" y="430.957402" transform="rotate(-0 320.04 430.957402)">Data file</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="20.153698" transform="rotate(-0 222.48 20.153698)">NASA POWER API</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="30.236578" transform="rotate(-0 222.48 30.236578)">monthly GHI, cloud amount and RH</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="62.095479" transform="rotate(-0 222.48 62.095479)">Download 2005–2025 into a new file</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="72.176578" transform="rotate(-0 222.48 72.176578)">the original 2005–2024 file is kept unchanged</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="103.810948" transform="rotate(-0 222.48 103.810948)">Validate</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="113.893313" transform="rotate(-0 222.48 113.893313)">the same checks as data pre-processing</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="155.357969" transform="rotate(-0 222.48 155.357969)">All checks pass?</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="378.72" y="145.691208" transform="rotate(-0 378.72 145.691208)">Wait and retry</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(355.040391 157.275987)">until NASA has</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(354.639906 164.909943)">published 2025</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="196.857521" transform="rotate(-0 222.48 196.857521)">Check year (2025)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(111.585211 207.73369)">Retrain on 2005–2024 → forecast 2025 → compare with observations;</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(154.407641 215.977802)">its errors are added to the weighting history</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="247.10201" transform="rotate(-0 222.48 247.10201)">Final forecast (2026)</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="257.936578" transform="rotate(-0 222.48 257.936578)">Retrain on 2005–2025 → forecast January–December 2026 for every grid cell</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="289.631885" transform="rotate(-0 222.48 289.631885)">Combine the components</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="300.416578" transform="rotate(-0 222.48 300.416578)">time-varying weights from all past errors (2014–2025)</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="332.249208" transform="rotate(-0 222.48 332.249208)">Summarise</text>
   </g>
   <g id="text_21">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(116.188008 342.332088)">monthly values · annual mean and annual total · difference from the</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(132.503586 350.661068)">2005–2025 average · uncertainty ranges from past errors</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="380.335479" transform="rotate(-0 222.48 380.335479)">2026 forecast</text>
   </g>
   <g id="text_23">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="390.416578" transform="rotate(-0 222.48 390.416578)">tables (monthly, annual) and maps</text>
   </g>
   <g id="text_24">
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="228.24" y="181.409727" transform="rotate(-0 228.24 181.409727)">Yes</text>
   </g>
   <g id="text_25">
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="306.72" y="148.649727" transform="rotate(-0 306.72 148.649727)">No</text>
