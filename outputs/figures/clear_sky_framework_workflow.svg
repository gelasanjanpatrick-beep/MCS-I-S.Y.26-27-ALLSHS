   </g>
   <g id="text_2">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="164.52" y="436.717402" transform="rotate(-0 164.52 436.717402)">Process</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="241.92" y="436.717402" transform="rotate(-0 241.92 436.717402)">Data file</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="327.24" y="436.717402" transform="rotate(-0 327.24 436.717402)">Start / end</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="124.92" y="19.451885" transform="rotate(-0 124.92 19.451885)">Grid points + SRTM elevation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="124.92" y="30.203852" transform="rotate(-0 124.92 30.203852)">93 query coordinates and site altitudes</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="340.92" y="15.98201" transform="rotate(-0 340.92 15.98201)">Observed monthly GHI</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="340.92" y="27.063414" transform="rotate(-0 340.92 27.063414)">NASA POWER, 2005 onward</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="124.92" y="61.808541" transform="rotate(-0 124.92 61.808541)">Ineichen-Perez clear-sky GHI</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(78.944727 72.599843)">pvlib: sun position every hour</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(81.216172 80.928823)">+ Linke turbidity climatology</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(74.019656 89.257802)">→ daily totals → monthly means</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(104.788727 97.630047)">(2005–2026)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="124.92" y="128.30201" transform="rotate(-0 124.92 128.30201)">Clear-sky GHI table</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="124.92" y="139.136578" transform="rotate(-0 124.92 139.136578)">known in advance for any year</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="225.72" y="183.897521" transform="rotate(-0 225.72 183.897521)">Clear-sky index (CSI)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(91.679211 194.732088)">CSI = observed GHI ÷ clear-sky GHI (about 0.4–1.0). It removes the regular seasonal</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(112.718508 203.102669)">effect of the sun and leaves the cloud-driven part for the models to learn</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="225.72" y="234.893698" transform="rotate(-0 225.72 234.893698)">SARIMAX and LSTM forecast the CSI</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="225.72" y="244.976578" transform="rotate(-0 225.72 244.976578)">The same two components as the hybrid, with CSI in place of GHI</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="225.72" y="277.375479" transform="rotate(-0 225.72 277.375479)">Convert back to GHI</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="225.72" y="287.456578" transform="rotate(-0 225.72 287.456578)">Forecast GHI = forecast CSI × clear-sky GHI of the target month</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="225.72" y="319.10201" transform="rotate(-0 225.72 319.10201)">Combine with time-varying weights</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="225.72" y="329.936578" transform="rotate(-0 225.72 329.936578)">The same weighting as the hybrid SARIMAX-LSTM</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="225.72" y="359.42201" transform="rotate(-0 225.72 359.42201)">Hybrid + CSI forecast</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="225.72" y="370.256578" transform="rotate(-0 225.72 370.256578)">12 monthly GHI values per grid cell</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="225.72" y="406.6065" transform="rotate(-0 225.72 406.6065)">Next: add the penalized loss (stack 3)</text>
   </g>
