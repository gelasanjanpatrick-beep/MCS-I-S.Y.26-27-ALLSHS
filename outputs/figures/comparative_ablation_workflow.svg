   <g id="text_1">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="32.4" y="386.317402" transform="rotate(-0 32.4 386.317402)">Process</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: start; fill: #1a1a1a" x="109.8" y="386.317402" transform="rotate(-0 109.8 386.317402)">Data file</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="14.591885" transform="rotate(-0 222.48 14.591885)">Out-of-sample forecasts, 2015–2024</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="25.376578" transform="rotate(-0 222.48 25.376578)">rolling validation + final test · 11,160 per model</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="57.02201" transform="rotate(-0 222.48 57.02201)">Squared error of every forecast</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="67.856578" transform="rotate(-0 222.48 67.856578)">error² = (forecast − observed)²</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="97.497521" transform="rotate(-0 222.48 97.497521)">Monthly loss differential (model A vs model B)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(126.392039 108.332088)">d = average over the 93 grid cells of [error² of A − error² of B],</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(163.870055 117.364966)">one value for each of the 120 months</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="148.450948" transform="rotate(-0 222.48 148.450948)">Diebold–Mariano test with HLN correction</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="158.61818" transform="rotate(-0 222.48 158.61818)">allows for correlation up to 11 months apart · Student's t, df = 119 · two-sided</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="118.08" y="205.808541" transform="rotate(-0 118.08 205.808541)">Comparative analysis</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(69.742312 216.68471)">Proposed model vs SARIMAX,</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(72.704898 224.972088)">LSTM, XGBoost, climatology</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(87.489539 233.963365)">and seasonal naive</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(105.258953 241.630047)">(5 tests)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="326.88" y="205.762229" transform="rotate(-0 326.88 205.762229)">Ablation analysis</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(290.878008 216.643109)">Hybrid vs Hybrid + CSI</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(272.526172 224.972088)">Hybrid + CSI vs Hybrid + CSI + PL</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(282.490023 233.301068)">Hybrid vs Hybrid + CSI + PL</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(314.058953 241.630047)">(3 tests)</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="286.857521" transform="rotate(-0 222.48 286.857521)">Holm adjustment and decision (α = 0.05)</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(168.704711 297.692088)">significant if the adjusted p &lt; 0.05;</text>
    <text style="font-size: 7.1px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(144.150914 306.021068)">the sign of d shows which model is more accurate</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="335.650948" transform="rotate(-0 222.48 335.650948)">Test tables</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.1px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="222.48" y="345.774914" transform="rotate(-0 222.48 345.774914)">comparative and ablation results</text>
   </g>
  </g>
 </g>
